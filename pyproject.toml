[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thash"
description = "A very compact representation of an image placeholder (thumbhash, RGBA-safe fork)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["thumbhash", "placeholder", "image", "hash"]
authors = [
  { name = "Jianqi Pan", email = "jannchie@gmail.com" },
  { name = "Justin Forlenza", email = "justin@forlenza.co" },
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Topic :: Multimedia :: Graphics",
]
# The package works with no deps (pure-Python fallback). Extras turn on
# acceleration and image-decoding helpers.
dependencies = []
dynamic = ["version"]

[project.optional-dependencies]
pillow = ["pillow>=10"]
numpy = ["numpy>=1.24"]
# `all` pulls in the recommended runtime: NumPy fast path + Pillow decoding.
all = ["thash[pillow,numpy]"]

[project.scripts]
# The CLI uses the high-level encode() API. Pillow is required for image
# decoding / PNG output; numpy is optional (only accelerates the encode/decode).
# Install with `pip install thash[pillow]` for the CLI, or `[all]` for the
# fast path too.
thash = "thash._cli:main"

[project.urls]
Documentation = "https://github.com/Jannchie/thumbhash-py#readme"
Issues = "https://github.com/Jannchie/thumbhash-py/issues"
Source = "https://github.com/Jannchie/thumbhash-py"

# PEP 735 dependency groups (consumed natively by uv).
# Install with: `uv sync --group dev` or `uv sync --all-groups`.
[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.7"]
bench = ["numpy>=1.24", "pillow>=10"]

[tool.uv]
# Build the project itself into the env so editable imports work.
package = true

[tool.ruff]
line-length = 120
extend-exclude = ["dist", ".venv"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "SIM", # flake8-simplify
  "RUF", # ruff-specific
]
ignore = [
  # The reference ThumbHash algorithm uses single-letter names (l/p/q for
  # luminance + chroma channels, lx/ly for low-freq counts). Renaming would
  # drift from the spec and reference impls.
  "E741",
  # We deliberately keep the legacy List/Tuple type aliases in places to read
  # naturally for users on older type-checkers.
  "UP006",
  "UP035",
]

[tool.ruff.lint.per-file-ignores]
# Benchmarks intentionally print, reach into private backends, and inject sys.path.
"benchmarks/*" = ["T201", "B", "E402", "I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.hatch.version]
path = "thash/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["thash"]

[tool.hatch.build.targets.sdist]
include = ["thash", "README.md", "LICENSE"]

[tool.coverage.run]
branch = true
parallel = true
omit = ["thash/__about__.py"]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__.:", "if TYPE_CHECKING:"]
